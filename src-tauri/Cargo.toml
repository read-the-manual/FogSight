[package]
name = "wujian"
version = "0.1.0"
description = "雾见：看清磁盘空间都去哪了"
authors = ["今天是大雾!", "Claude"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
